<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Momento AI</title>

<link rel="stylesheet" href="chat.css">

</head>

<body>

<aside class="sidebar">

<div class="sidebar-top">

<div class="brand">

<img src="logo.png" alt="Momento AI">

<span>Momento AI</span>

</div>

<button class="new-chat">

+ New Chat

</button>

</div>

<div class="chat-history">

<h3>Recent Chats</h3>

<div class="history-list"></div>

</div>

<div class="sidebar-bottom">

<button id="settingsBtn">

Settings

</button>

<button id="profileBtn">

Profile

</button>

</div>

</aside>

<main class="main">

<header class="topbar">

<h2>Momento AI</h2>

</header>

<section
class="chat-area"
id="chatArea">

<div class="welcome">

<img src="logo.png" alt="Momento AI">

<h1>

How can I help you today?

</h1>

<p>

Think • Learn • Evolve

</p>

</div>

</section>

<section class="suggestions">

<button class="suggestion">

Explain Artificial Intelligence

</button>

<button class="suggestion">

Write JavaScript Code

</button>

<button class="suggestion">

Solve Mathematics

</button>

<button class="suggestion">

Generate Ideas

</button>

</section>

<footer class="chat-footer">

<div class="chat-input-box">

<button
class="icon-btn"
id="attachBtn"
title="Attach">

📎

</button>

<input
type="text"
id="userInput"
placeholder="Message Momento AI...">

<button
class="icon-btn"
id="voiceBtn"
title="Voice">

🎤

</button>

<button
class="send-btn"
id="sendBtn"
title="Send">

➤

</button>

</div>

<p class="footer-note">

Momento AI may produce incorrect information. Verify important facts.

</p>

</footer>

</main>
<script type="module" src="chat.js"></script>

</body>

</html>
